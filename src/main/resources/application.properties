# Spring Application Name
spring.application.name=wineInventory

# Active profile (dev by default, use SPRING_PROFILES_ACTIVE=prod in production)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Spring DataSource Configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/wineinventory?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.wineinventory.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Application Information for Documentation

# Elements take their values from maven pom.xml build-related information

# Custom Properties for Documentation
# suppress inspection "SpringBootApplicationProperties"
documentation.application.description=@project.description@
# suppress inspection "SpringBootApplicationProperties"
documentation.application.version=@project.version@

# JWT Configuration Properties

# Custom Properties for JWT
# The secret must have at least 32 characters (HMAC-SHA256)
# suppress inspection "SpringBootApplicationProperties"
authorization.jwt.secret=${JWT_SECRET}
# suppress inspection "SpringBootApplicationProperties"
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}

# Cloudinary Configuration Properties
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Frontend Configuration
base-url=${FRONTEND_URL:http://localhost:4200}

# CORS Configuration (comma separated list of origins)
# suppress inspection "SpringBootApplicationProperties"
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# PayPal Configuration
paypal.client.id=${PAYPAL_CLIENT_ID:}
paypal.client.secret=${PAYPAL_CLIENT_SECRET:}
paypal.api.base-url=${PAYPAL_API_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.webhook.id=${PAYPAL_WEBHOOK_ID:}
