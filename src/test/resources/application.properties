# Test configuration: in-memory H2 database in MySQL mode, no external services required
spring.application.name=wineInventory
spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:wineinventory;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.naming.physical-strategy=com.wineinventory.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

documentation.application.description=wineInventory-platform
documentation.application.version=test

authorization.jwt.secret=test-secret-key-with-at-least-32-characters-0123456789
authorization.jwt.expiration.days=1

cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test

base-url=http://localhost:4200
cors.allowed-origins=http://localhost:4200

paypal.client.id=test
paypal.client.secret=test
paypal.api.base-url=http://localhost:9
paypal.webhook.id=test
paypal.return-url=http://localhost:8080/api/v1/subscriptions/paypal/return
paypal.cancel-url=http://localhost:8080/api/v1/subscriptions/paypal/cancel
